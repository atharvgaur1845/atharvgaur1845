<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="A hand-drawn knowledge atlas: charted regions for foundations, representation, time and structure; uncharted dashed territories for reasoning, memory and continual learning; dotted expedition routes between them.">
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">

    <!-- graticule: star-chart crosses -->
    <g stroke="#D8DEE4" stroke-width="1" opacity="0.5">
      <path d="M150,150 h8 M154,146 v8"/> <path d="M400,120 h8 M404,116 v8"/> <path d="M650,90 h8 M654,86 v8"/>
      <path d="M900,140 h8 M904,136 v8"/> <path d="M1120,220 h8 M1124,216 v8"/> <path d="M100,300 h8 M104,296 v8"/>
      <path d="M340,380 h8 M344,376 v8"/> <path d="M590,320 h8 M594,316 v8"/> <path d="M860,340 h8 M864,336 v8"/>
      <path d="M180,560 h8 M184,556 v8"/> <path d="M480,560 h8 M484,556 v8"/> <path d="M740,580 h8 M744,576 v8"/>
      <path d="M960,600 h8 M964,596 v8"/> <path d="M1120,520 h8 M1124,516 v8"/> <path d="M60,440 h8 M64,436 v8"/>
    </g>

    <!-- cartouche -->
    <text x="40" y="56" font-size="16" letter-spacing="8" fill="#1F2328">THE TERRITORY</text>
    <text x="40" y="80" font-size="11.5" font-style="italic" fill="#59636E">a working map of one researcher's knowledge — charted by hand, revised by evidence</text>

    <!-- compass -->
    <g stroke="#59636E" stroke-width="1">
      <line x1="1120" y1="52" x2="1120" y2="112"/>
      <line x1="1090" y1="82" x2="1150" y2="82"/>
    </g>
    <polygon points="1120,46 1116,58 1124,58" fill="#1F2328"/>
    <text x="1120" y="40" font-size="10" fill="#1F2328" text-anchor="middle">N</text>

    <!-- region: FOUNDATIONS -->
    <text x="120" y="392" font-size="13" letter-spacing="4" fill="#59636E">FOUNDATIONS</text>
    <line x1="120" y1="400" x2="228" y2="400" stroke="#D8DEE4"/>
    <path d="M110,430 C160,398 280,398 320,440 C340,480 300,530 220,536 C150,540 96,486 110,430 Z"
          fill="none" stroke="#D8DEE4" stroke-dasharray="2 5" opacity="0.7"/>
    <g fill="#1F2328">
      <circle cx="150" cy="440" r="3"/><circle cx="262" cy="430" r="3"/>
      <circle cx="140" cy="506" r="3"/><circle cx="252" cy="498" r="3"/>
    </g>
    <text x="160" y="444" font-size="11.5" fill="#1F2328">optimization</text>
    <text x="272" y="434" font-size="11.5" fill="#1F2328">probability</text>
    <text x="150" y="510" font-size="11.5" fill="#1F2328">linear algebra</text>
    <text x="262" y="502" font-size="11.5" fill="#1F2328">learning dynamics</text>

    <!-- region: REPRESENTATION -->
    <text x="340" y="168" font-size="13" letter-spacing="4" fill="#59636E">REPRESENTATION</text>
    <line x1="340" y1="176" x2="475" y2="176" stroke="#D8DEE4"/>
    <path d="M320,230 C360,186 520,176 580,220 C620,260 590,330 500,350 C400,368 300,300 320,230 Z"
          fill="none" stroke="#D8DEE4" stroke-dasharray="2 5" opacity="0.7"/>
    <g fill="#1F2328">
      <circle cx="352" cy="226" r="3"/><circle cx="492" cy="206" r="3"/>
      <circle cx="386" cy="292" r="3"/><circle cx="530" cy="262" r="3"/>
    </g>
    <text x="362" y="230" font-size="11.5" fill="#1F2328">self-supervision</text>
    <text x="502" y="210" font-size="11.5" fill="#1F2328">contrastive vs predictive</text>
    <text x="396" y="296" font-size="11.5" fill="#1F2328">collapse + dimensionality</text>
    <text x="540" y="266" font-size="11.5" fill="#1F2328">invariance</text>
    <circle cx="452" cy="330" r="3" fill="#C15F3C"/>
    <text x="462" y="334" font-size="11.5" font-style="italic" fill="#C15F3C">what makes z useful?</text>

    <!-- region: TIME -->
    <text x="790" y="118" font-size="13" letter-spacing="4" fill="#59636E">TIME</text>
    <line x1="790" y1="126" x2="826" y2="126" stroke="#D8DEE4"/>
    <path d="M730,166 C790,126 920,130 950,180 C972,230 920,280 840,282 C760,284 700,220 730,166 Z"
          fill="none" stroke="#D8DEE4" stroke-dasharray="2 5" opacity="0.7"/>
    <g fill="#1F2328">
      <circle cx="762" cy="176" r="3"/><circle cx="892" cy="200" r="3"/>
    </g>
    <text x="772" y="180" font-size="11.5" fill="#1F2328">temporal structure</text>
    <text x="902" y="204" font-size="11.5" fill="#1F2328">long-horizon prediction</text>
    <circle cx="820" cy="246" r="4.5" fill="#C15F3C"/>
    <text x="832" y="250" font-size="12.5" font-weight="600" fill="#C15F3C">world models</text>

    <!-- region: STRUCTURE -->
    <text x="640" y="398" font-size="13" letter-spacing="4" fill="#59636E">STRUCTURE</text>
    <line x1="640" y1="406" x2="730" y2="406" stroke="#D8DEE4"/>
    <path d="M630,436 C680,406 830,404 866,446 C892,486 850,530 760,534 C670,538 606,486 630,436 Z"
          fill="none" stroke="#D8DEE4" stroke-dasharray="2 5" opacity="0.7"/>
    <g fill="#1F2328">
      <circle cx="656" cy="438" r="3"/><circle cx="790" cy="442" r="3"/>
      <circle cx="668" cy="500" r="3"/><circle cx="800" cy="498" r="3"/>
    </g>
    <text x="666" y="442" font-size="11.5" fill="#1F2328">graphs</text>
    <text x="800" y="446" font-size="11.5" fill="#1F2328">geometry of latent space</text>
    <text x="678" y="504" font-size="11.5" fill="#1F2328">graph neural nets</text>
    <text x="810" y="502" font-size="11.5" fill="#1F2328">spectral methods</text>

    <!-- region: UNCHARTED -->
    <text x="990" y="352" font-size="13" letter-spacing="4" fill="#59636E">UNCHARTED</text>
    <line x1="990" y1="360" x2="1082" y2="360" stroke="#D8DEE4"/>
    <circle cx="1000" cy="408" r="3" fill="none" stroke="#1F2328"/>
    <circle cx="1000" cy="408" r="24" fill="none" stroke="#D8DEE4" stroke-dasharray="4 4"/>
    <text x="1032" y="412" font-size="11.5" font-style="italic" fill="#59636E">reasoning</text>
    <circle cx="1088" cy="472" r="3" fill="none" stroke="#1F2328"/>
    <circle cx="1088" cy="472" r="22" fill="none" stroke="#D8DEE4" stroke-dasharray="4 4"/>
    <text x="1002" y="476" font-size="11.5" font-style="italic" fill="#59636E" text-anchor="end">memory</text>
    <circle cx="1000" cy="540" r="3" fill="none" stroke="#1F2328"/>
    <circle cx="1000" cy="540" r="27" fill="none" stroke="#D8DEE4" stroke-dasharray="4 4"/>
    <text x="1036" y="544" font-size="11.5" font-style="italic" fill="#59636E">continual learning</text>
    <text x="1040" y="590" font-size="10.5" font-style="italic" fill="#59636E">here be open questions</text>

    <!-- expedition routes -->
    <path d="M250,420 C300,380 340,330 396,286" fill="none" stroke="#C15F3C" stroke-width="1.3" stroke-dasharray="1 6" stroke-linecap="round"/>
    <path d="M520,240 C600,200 680,190 750,180" fill="none" stroke="#C15F3C" stroke-width="1.3" stroke-dasharray="1 6" stroke-linecap="round"/>
    <path d="M690,450 C740,400 780,330 812,262" fill="none" stroke="#C15F3C" stroke-width="1.3" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="596" y="180" font-size="10" font-style="italic" fill="#C15F3C">current expedition</text>
    <path d="M872,262 C920,300 950,350 986,392" fill="none" stroke="#59636E" stroke-width="1" stroke-dasharray="1 7" stroke-linecap="round" opacity="0.7"/>
    <text x="922" y="322" font-size="10" font-style="italic" fill="#59636E">planned</text>

    <!-- legend -->
    <circle cx="46" cy="598" r="3" fill="#1F2328"/>
    <text x="56" y="602" font-size="11" fill="#59636E">charted — worked in</text>
    <circle cx="222" cy="598" r="6" fill="none" stroke="#D8DEE4" stroke-dasharray="3 3"/>
    <text x="234" y="602" font-size="11" fill="#59636E">uncharted — next</text>
    <line x1="378" y1="598" x2="410" y2="598" stroke="#C15F3C" stroke-width="1.3" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="418" y="602" font-size="11" fill="#59636E">expedition route</text>

    <text x="1160" y="628" font-size="10" font-style="italic" fill="#59636E" text-anchor="end">drawn 2026 · revised continuously</text>
  </g>
</svg>
