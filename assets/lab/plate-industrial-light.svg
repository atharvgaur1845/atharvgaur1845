<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Figure three: industrial time-series pipeline. A raw vibration signal is windowed into a spectrum, encoded self-supervised, and fault modes separate as clusters in embedding space.">
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="24" y="30" font-size="10.5" letter-spacing="3" fill="#59636E">INDUSTRIAL TIME-SERIES — PIPELINE</text>

    <!-- raw signal -->
    <path d="M40,110 C46,92 52,88 58,102 C64,116 68,134 74,120 C80,106 84,84 90,96 C96,108 100,128 106,118 C112,108 116,86 122,94 C128,102 132,124 138,126 C144,128 148,98 154,92 C160,86 164,112 170,120 C176,128 180,104 186,96 C192,88 196,116 202,122 C208,128 214,96 220,94 C226,92 230,108 236,110"
          fill="none" stroke="#1F2328" stroke-width="1.3"/>
    <line x1="40" y1="110" x2="236" y2="110" stroke="#D8DEE4" stroke-width="0.75" stroke-dasharray="2 3"/>
    <text x="138" y="160" font-size="11" fill="#59636E" text-anchor="middle">raw vibration signal</text>

    <!-- windowing + fft -->
    <line x1="252" y1="105" x2="292" y2="105" stroke="#59636E" stroke-width="1.2"/>
    <polygon points="292,101 300,105 292,109" fill="#59636E"/>
    <rect x="300" y="80" width="160" height="50" rx="3" fill="#F6F8FA" stroke="#1F2328"/>
    <text x="380" y="101" font-size="12.5" fill="#1F2328" text-anchor="middle">windowing + fft</text>
    <text x="380" y="118" font-size="10.5" fill="#59636E" text-anchor="middle">spectral features</text>

    <!-- spectrum -->
    <line x1="460" y1="105" x2="500" y2="105" stroke="#59636E" stroke-width="1.2"/>
    <polygon points="500,101 508,105 500,109" fill="#59636E"/>
    <g fill="#1F2328" fill-opacity="0.75">
      <rect x="524" y="123" width="6" height="12"/>
      <rect x="534" y="105" width="6" height="30"/>
      <rect x="544" y="87"  width="6" height="48"/>
      <rect x="554" y="109" width="6" height="26" fill="#C15F3C" fill-opacity="1"/>
      <rect x="564" y="97"  width="6" height="38"/>
      <rect x="574" y="117" width="6" height="18"/>
      <rect x="584" y="125" width="6" height="10"/>
      <rect x="594" y="113" width="6" height="22"/>
      <rect x="604" y="127" width="6" height="8"/>
      <rect x="614" y="119" width="6" height="16"/>
    </g>
    <line x1="518" y1="135" x2="626" y2="135" stroke="#D8DEE4" stroke-width="1"/>
    <text x="572" y="160" font-size="11" fill="#59636E" text-anchor="middle">spectrum · fault band</text>

    <!-- encoder -->
    <line x1="642" y1="105" x2="682" y2="105" stroke="#59636E" stroke-width="1.2"/>
    <polygon points="682,101 690,105 682,109" fill="#59636E"/>
    <rect x="690" y="80" width="170" height="50" rx="3" fill="#F6F8FA" stroke="#1F2328"/>
    <text x="775" y="101" font-size="12.5" fill="#1F2328" text-anchor="middle">ssl encoder</text>
    <text x="775" y="118" font-size="10.5" fill="#59636E" text-anchor="middle">no labels used</text>

    <!-- embedding space -->
    <line x1="860" y1="105" x2="900" y2="105" stroke="#59636E" stroke-width="1.2"/>
    <polygon points="900,101 908,105 900,109" fill="#59636E"/>
    <g fill="#59636E">
      <circle cx="948" cy="78" r="3"/><circle cx="962" cy="70" r="3"/><circle cx="955" cy="88" r="3"/>
      <circle cx="972" cy="82" r="3"/><circle cx="940" cy="66" r="3"/><circle cx="966" cy="94" r="3"/>
      <circle cx="1080" cy="62" r="3"/><circle cx="1094" cy="70" r="3"/><circle cx="1086" cy="52" r="3"/>
      <circle cx="1102" cy="58" r="3"/><circle cx="1072" cy="74" r="3"/>
    </g>
    <g fill="#C15F3C">
      <circle cx="1010" cy="132" r="3"/><circle cx="1024" cy="140" r="3"/><circle cx="1016" cy="122" r="3"/>
      <circle cx="1032" cy="128" r="3"/><circle cx="1002" cy="142" r="3"/><circle cx="1022" cy="152" r="3"/>
    </g>
    <circle cx="1017" cy="136" r="30" fill="none" stroke="#C15F3C" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="1024" y="186" font-size="11" fill="#59636E" text-anchor="middle">fault modes separate in embedding space</text>

    <!-- caption -->
    <text x="600" y="204" font-size="11.5" font-style="italic" fill="#59636E" text-anchor="middle">fig. 3 — representations of machine vibration that separate fault modes without a single label.</text>
  </g>
</svg>
