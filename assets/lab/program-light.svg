<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Figure one: the research program. Foundations feed a core program in representation learning and world models; a dashed horizon lists future directions.">
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">

    <!-- column headers -->
    <text x="60" y="42" font-size="11" letter-spacing="4" fill="#59636E">FOUNDATIONS</text>
    <line x1="60" y1="52" x2="320" y2="52" stroke="#D8DEE4" stroke-width="1"/>
    <text x="480" y="42" font-size="11" letter-spacing="4" fill="#59636E">CORE PROGRAM</text>
    <line x1="480" y1="52" x2="800" y2="52" stroke="#D8DEE4" stroke-width="1"/>
    <text x="920" y="42" font-size="11" letter-spacing="4" fill="#59636E">HORIZON</text>
    <line x1="920" y1="52" x2="1140" y2="52" stroke="#D8DEE4" stroke-width="1"/>

    <!-- foundations column -->
    <g>
      <rect x="60" y="80" width="200" height="30" rx="3" fill="#F6F8FA" stroke="#D8DEE4"/>
      <text x="72" y="100" font-size="12.5" fill="#1F2328">mathematics</text>
      <rect x="60" y="132" width="200" height="30" rx="3" fill="#F6F8FA" stroke="#D8DEE4"/>
      <text x="72" y="152" font-size="12.5" fill="#1F2328">probability</text>
      <rect x="60" y="184" width="200" height="30" rx="3" fill="#F6F8FA" stroke="#D8DEE4"/>
      <text x="72" y="204" font-size="12.5" fill="#1F2328">optimization</text>
      <rect x="60" y="236" width="200" height="30" rx="3" fill="#F6F8FA" stroke="#D8DEE4"/>
      <text x="72" y="256" font-size="12.5" fill="#1F2328">learning dynamics</text>
      <g stroke="#D8DEE4" stroke-width="1">
        <line x1="160" y1="110" x2="160" y2="132"/>
        <line x1="160" y1="162" x2="160" y2="184"/>
        <line x1="160" y1="214" x2="160" y2="236"/>
      </g>
    </g>

    <!-- bus: foundations -> core -->
    <g stroke="#D8DEE4" stroke-width="1" fill="none">
      <line x1="260" y1="95" x2="420" y2="95"/>
      <line x1="260" y1="147" x2="420" y2="147"/>
      <line x1="260" y1="199" x2="420" y2="199"/>
      <line x1="260" y1="251" x2="420" y2="251"/>
      <line x1="420" y1="95" x2="420" y2="251"/>
      <line x1="420" y1="173" x2="472" y2="173"/>
    </g>
    <polygon points="472,169 480,173 472,177" fill="#59636E"/>

    <!-- core column -->
    <g>
      <rect x="480" y="66" width="250" height="44" rx="3" fill="#F6F8FA" stroke="#D8DEE4"/>
      <text x="494" y="84" font-size="12.5" fill="#1F2328">self-supervised learning</text>
      <text x="494" y="100" font-size="10" fill="#59636E">learning without labels</text>

      <rect x="480" y="126" width="250" height="44" rx="3" fill="#F6F8FA" stroke="#D8DEE4"/>
      <text x="494" y="144" font-size="12.5" fill="#1F2328">representation learning</text>
      <text x="494" y="160" font-size="10" fill="#59636E">what makes z useful</text>

      <rect x="480" y="186" width="250" height="44" rx="3" fill="#F6F8FA" stroke="#D8DEE4"/>
      <text x="494" y="204" font-size="12.5" fill="#1F2328">temporal structure</text>
      <text x="494" y="220" font-size="10" fill="#59636E">long-horizon stability</text>

      <rect x="480" y="246" width="250" height="44" rx="3" fill="#C15F3C" fill-opacity="0.06" stroke="#C15F3C" stroke-width="1.5"/>
      <text x="494" y="264" font-size="12.5" fill="#C15F3C" font-weight="600">world models</text>
      <text x="494" y="280" font-size="10" fill="#59636E">prediction in latent space</text>

      <g stroke="#D8DEE4" stroke-width="1">
        <line x1="605" y1="110" x2="605" y2="126"/>
        <line x1="605" y1="170" x2="605" y2="186"/>
        <line x1="605" y1="230" x2="605" y2="246"/>
      </g>
      <polygon points="601,120 605,127 609,120" fill="#59636E"/>
      <polygon points="601,180 605,187 609,180" fill="#59636E"/>
      <polygon points="601,240 605,247 609,240" fill="#59636E"/>
    </g>

    <!-- bus: core -> horizon -->
    <g stroke="#D8DEE4" stroke-width="1" fill="none">
      <line x1="730" y1="268" x2="880" y2="268"/>
      <line x1="880" y1="95" x2="880" y2="268"/>
      <line x1="880" y1="95" x2="912" y2="95"/>
      <line x1="880" y1="147" x2="912" y2="147"/>
      <line x1="880" y1="199" x2="912" y2="199"/>
      <line x1="880" y1="251" x2="912" y2="251"/>
    </g>
    <polygon points="912,91 920,95 912,99" fill="#59636E"/>
    <polygon points="912,143 920,147 912,151" fill="#59636E"/>
    <polygon points="912,195 920,199 912,203" fill="#59636E"/>
    <polygon points="912,247 920,251 912,255" fill="#59636E"/>

    <!-- horizon column (dashed = not yet) -->
    <g fill="none" stroke="#D8DEE4" stroke-dasharray="4 4">
      <rect x="920" y="80" width="220" height="30" rx="3"/>
      <rect x="920" y="132" width="220" height="30" rx="3"/>
      <rect x="920" y="184" width="220" height="30" rx="3"/>
      <rect x="920" y="236" width="220" height="30" rx="3"/>
    </g>
    <g fill="#59636E" font-size="12">
      <text x="932" y="100">reasoning</text>
      <text x="932" y="152">memory + continual learning</text>
      <text x="932" y="204">embodied agents</text>
      <text x="932" y="256">neuroscience-inspired learning</text>
    </g>

    <!-- caption -->
    <text x="600" y="352" font-size="11.5" font-style="italic" fill="#59636E" text-anchor="middle">fig. 1 — the research program. mathematical foundations feed a core program in representation learning and world models;</text>
    <text x="600" y="370" font-size="11.5" font-style="italic" fill="#59636E" text-anchor="middle">the dashed horizon is what the core should eventually make possible.</text>
  </g>
</svg>
