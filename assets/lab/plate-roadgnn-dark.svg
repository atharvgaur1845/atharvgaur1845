<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Figure three: road risk GNN architecture. A road network graph passes through message-passing layers to node embeddings and a risk head, producing per-segment risk on the same graph.">
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="24" y="30" font-size="10.5" letter-spacing="3" fill="#9198A1">ROAD RISK GNN — ARCHITECTURE</text>

    <!-- input road graph -->
    <g stroke="#E6EDF3" stroke-width="1.2">
      <line x1="60" y1="70" x2="120" y2="52"/>
      <line x1="120" y1="52" x2="180" y2="80"/>
      <line x1="60" y1="70" x2="90" y2="125"/>
      <line x1="90" y1="125" x2="150" y2="115"/>
      <line x1="150" y1="115" x2="180" y2="80"/>
      <line x1="150" y1="115" x2="210" y2="135"/>
      <line x1="90" y1="125" x2="65" y2="160"/>
      <line x1="65" y1="160" x2="135" y2="168"/>
      <line x1="135" y1="168" x2="210" y2="135"/>
    </g>
    <g fill="#E6EDF3">
      <circle cx="60" cy="70" r="3.5"/><circle cx="120" cy="52" r="3.5"/><circle cx="180" cy="80" r="3.5"/>
      <circle cx="90" cy="125" r="3.5"/><circle cx="150" cy="115" r="3.5"/><circle cx="210" cy="135" r="3.5"/>
      <circle cx="65" cy="160" r="3.5"/><circle cx="135" cy="168" r="3.5"/>
    </g>
    <text x="135" y="192" font-size="11" fill="#9198A1" text-anchor="middle">road network graph</text>

    <!-- message passing -->
    <line x1="240" y1="105" x2="292" y2="105" stroke="#9198A1" stroke-width="1.2"/>
    <polygon points="292,101 300,105 292,109" fill="#9198A1"/>
    <rect x="300" y="80" width="180" height="50" rx="3" fill="#161B22" stroke="#E6EDF3"/>
    <text x="390" y="101" font-size="12.5" fill="#E6EDF3" text-anchor="middle">message passing × L</text>
    <text x="390" y="118" font-size="10.5" fill="#9198A1" text-anchor="middle">neighborhood aggregation</text>

    <!-- node embeddings -->
    <line x1="480" y1="105" x2="522" y2="105" stroke="#9198A1" stroke-width="1.2"/>
    <polygon points="522,101 530,105 522,109" fill="#9198A1"/>
    <g stroke="#30363D">
      <rect x="540" y="98" width="14" height="14" fill="#E2794F" fill-opacity="0.15"/>
      <rect x="560" y="98" width="14" height="14" fill="#E2794F" fill-opacity="0.35"/>
      <rect x="580" y="98" width="14" height="14" fill="#E2794F" fill-opacity="0.55"/>
      <rect x="600" y="98" width="14" height="14" fill="#E2794F" fill-opacity="0.75"/>
      <rect x="620" y="98" width="14" height="14" fill="#E2794F" fill-opacity="0.9"/>
      <rect x="640" y="98" width="14" height="14" fill="#E2794F" fill-opacity="0.25"/>
    </g>
    <text x="597" y="138" font-size="11" fill="#9198A1" text-anchor="middle">node embeddings</text>

    <!-- risk head -->
    <line x1="668" y1="105" x2="702" y2="105" stroke="#9198A1" stroke-width="1.2"/>
    <polygon points="702,101 710,105 702,109" fill="#9198A1"/>
    <rect x="710" y="80" width="130" height="50" rx="3" fill="#161B22" stroke="#E6EDF3"/>
    <text x="775" y="101" font-size="12.5" fill="#E6EDF3" text-anchor="middle">risk head</text>
    <text x="775" y="118" font-size="10.5" fill="#9198A1" text-anchor="middle">per-segment score</text>

    <!-- output graph with risk-weighted edges -->
    <line x1="840" y1="105" x2="882" y2="105" stroke="#9198A1" stroke-width="1.2"/>
    <polygon points="882,101 890,105 882,109" fill="#9198A1"/>
    <g stroke="#E2794F" stroke-width="2.5">
      <line x1="920" y1="70" x2="980" y2="52" stroke-opacity="0.25"/>
      <line x1="980" y1="52" x2="1040" y2="80" stroke-opacity="0.9"/>
      <line x1="920" y1="70" x2="950" y2="125" stroke-opacity="0.5"/>
      <line x1="950" y1="125" x2="1010" y2="115" stroke-opacity="0.35"/>
      <line x1="1010" y1="115" x2="1040" y2="80" stroke-opacity="0.7"/>
      <line x1="1010" y1="115" x2="1070" y2="135" stroke-opacity="0.2"/>
      <line x1="950" y1="125" x2="925" y2="160" stroke-opacity="0.85"/>
      <line x1="925" y1="160" x2="995" y2="168" stroke-opacity="0.3"/>
      <line x1="995" y1="168" x2="1070" y2="135" stroke-opacity="0.45"/>
    </g>
    <g fill="#E6EDF3">
      <circle cx="920" cy="70" r="3"/><circle cx="980" cy="52" r="3"/><circle cx="1040" cy="80" r="3"/>
      <circle cx="950" cy="125" r="3"/><circle cx="1010" cy="115" r="3"/><circle cx="1070" cy="135" r="3"/>
      <circle cx="925" cy="160" r="3"/><circle cx="995" cy="168" r="3"/>
    </g>
    <text x="995" y="192" font-size="11" fill="#9198A1" text-anchor="middle">per-segment risk</text>

    <!-- caption -->
    <text x="600" y="204" font-size="11.5" font-style="italic" fill="#9198A1" text-anchor="middle">fig. 3 — risk prediction over road networks: structure first, statistics second.</text>
  </g>
</svg>
